:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162e44;background:#edf4f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#0d2942;color:#fff;padding:17px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{font-size:22px;margin:0}header small{color:#b8d0e0}main{max-width:1180px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(90deg,rgba(7,37,62,.92),rgba(7,37,62,.3)),url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1600&q=85') center/cover;min-height:205px;border-radius:18px;color:white;padding:36px;display:flex;flex-direction:column;justify-content:center;margin-bottom:20px}.hero h2{font-size:36px;margin:0 0 9px}.hero p{max-width:650px;margin:0;line-height:1.55}.panel{background:white;border:1px solid #d6e3eb;border-radius:15px;padding:20px;box-shadow:0 3px 15px #173c5d08}.stack{display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;align-items:start}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.metric{background:#f0f6fa;padding:13px;border-radius:10px}.metric small{display:block;color:#375266;margin-bottom:6px}.metric strong{font-size:20px}.btn{border:0;border-radius:10px;background:#1375ac;color:#fff;padding:11px 17px;font-weight:700}.btn.alt{background:#e5f0f7;color:#124769}.btn:disabled{opacity:.5;cursor:not-allowed}h2,h3{margin:0 0 12px}p{line-height:1.55}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input[type=range]{width:100%;accent-color:#1375ac}input[type=text],select{width:100%;padding:10px;border:1px solid #bfcfda;border-radius:9px;background:white}.line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hint{color:#334a5d;font-size:13px}.bar{background:#e6edf1;border-radius:20px;height:10px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#2996ae;border-radius:20px}.group{display:grid;grid-template-columns:minmax(115px,1fr) 1.2fr 34px;gap:10px;align-items:center;margin:10px 0;font-size:13px}.event{border-left:5px solid #d28d3d;background:#fff5e8;padding:16px;border-radius:10px}.event strong{display:block;margin-bottom:5px}.option{border:1px solid #cbdde9;padding:12px;border-radius:11px;display:block;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:#167fac;background:#ecf8ff}.option:has(input:disabled){opacity:.56;cursor:not-allowed;background:#f1f4f6}.option input{margin-right:9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e2ebf1;padding:9px}th{color:#334d61}.score{font-size:44px;font-weight:800;color:#107b91}.pill{background:#d9eef7;color:#135578;padding:7px 10px;border-radius:40px;font-size:12px;font-weight:800}.timer{font-size:28px;font-variant-numeric:tabular-nums;font-weight:800}.bad{color:#bd4b3c}.good{color:#16866d}.muted{color:#40586b}.hide{display:none}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.top{margin-bottom:16px}@media(max-width:640px){.hero{padding:22px;min-height:160px}.hero h2{font-size:27px}.group{grid-template-columns:115px 1fr 28px}main{padding:12px 10px 40px}}

.event-screen{position:fixed;inset:0;z-index:500;background:#07192b;color:#fff;display:flex;align-items:flex-end;overflow:auto}
.event-photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.72)}
.event-shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,19,33,.97),rgba(3,19,33,.37) 60%,rgba(3,19,33,.12))}
.event-content{position:relative;z-index:1;width:min(1050px,100%);margin:0 auto;padding:clamp(28px,6vw,80px) 26px}
.event-content .kicker{font-size:15px;letter-spacing:.13em;text-transform:uppercase;color:#c8eafa;font-weight:800}
.event-content h2{font-size:clamp(35px,5vw,72px);line-height:1.06;margin:14px 0 22px;text-shadow:0 3px 18px #0009}
.event-content p{font-size:clamp(17px,2vw,24px);line-height:1.5;max-width:800px;margin-bottom:26px}

/* AlpenManager: einheitliche Startseite und Lehrpersonenbereich. */
/* Nur .am-entry betroffen: Spielsimulation, Berichte und Beamer bleiben unverändert. */
body:has(.am-entry){background:#f2f7fa}
main:has(.am-entry){max-width:1110px;padding-top:20px}
.am-entry{width:100%;max-width:1060px;margin:0 auto;color:#19354a}
.am-entry .am-welcome{
  position:relative;isolation:isolate;overflow:hidden;
  min-height:225px;margin:0 0 18px;padding:30px 36px;
  display:flex;align-items:center;
  background:linear-gradient(100deg,rgba(6,31,52,.96) 0%,rgba(8,45,68,.89) 48%,rgba(8,40,60,.27) 100%),
    url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1600&q=85') center 52%/cover;
  color:#fff;border-radius:19px;box-shadow:0 12px 30px rgba(22,58,85,.11)
}
.am-entry .am-welcome-inner{position:relative;z-index:1;max-width:770px}
.am-entry .am-eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:#b9e0f1;margin-bottom:12px}
.am-entry .am-welcome h2{font-size:clamp(27px,3.6vw,39px);line-height:1.13;letter-spacing:-.028em;font-weight:800;margin:0 0 11px;color:#fff}
.am-entry .am-welcome p{font-size:14px;max-width:640px;line-height:1.55;color:#e0edf4;margin:0}
.am-entry .am-facts{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:21px}
.am-entry .am-facts span{display:inline-flex;align-items:center;gap:6px;border-radius:50px;border:1px solid rgba(235,247,255,.26);padding:7px 11px;background:rgba(255,255,255,.10);font-size:12px;color:#e9f6fc}
.am-entry .am-facts strong{font-size:14px;color:white}
.am-entry .am-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:18px}
.am-entry .am-card{
 display:flex;flex-direction:column;min-width:0;
 padding:25px 26px 20px;background:#fff;
 border:1px solid #dce8ee;border-radius:17px;
 box-shadow:0 6px 25px rgba(33,70,97,.055)
}
.am-entry .am-card--primary{border-top:3px solid #137aab}
.am-entry .am-card--secondary{border-top:3px solid #365e79}
.am-entry .am-card-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.am-entry .am-card-symbol{
 display:flex;flex-shrink:0;align-items:center;justify-content:center;
 width:44px;height:44px;border-radius:13px;background:#e6f3f9;
 color:#16749c;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums
}
.am-entry .am-card--secondary .am-card-symbol{background:#edf1f6;color:#365e79}
.am-entry .am-card-overline{font-size:10px;line-height:1.4;letter-spacing:.12em;font-weight:800;color:#5f7c8d;margin:0 0 4px}
.am-entry .am-card h3{font-size:21px;line-height:1.2;letter-spacing:-.015em;margin:0}
.am-entry .am-card-intro{color:#506a7a;font-size:13px;line-height:1.55;margin:0 0 8px;max-width:450px}
.am-entry .am-form-group{margin-top:13px}
.am-entry .am-form-group label{display:block;font-size:12px;font-weight:750;color:#25465c;margin:0 0 7px}
.am-entry .am-card .net-input{
 display:block;width:100%;min-width:0;min-height:44px;margin:0;
 border:1px solid #c9dce6;border-radius:9px;background:#fff;
 padding:10px 13px;font-size:14px;color:#163d56;transition:border-color .16s,box-shadow .16s;
}
.am-entry .am-card .net-input:hover{border-color:#9fbfce}
.am-entry .am-card .net-input:focus{border-color:#147bac;outline:none;box-shadow:0 0 0 3px rgba(20,123,172,.13)}
.am-entry .am-input-code{text-transform:uppercase;letter-spacing:.065em;font-variant-numeric:tabular-nums}
.am-entry .am-submit{
 width:100%;min-height:47px;display:flex;align-items:center;justify-content:space-between;
 margin-top:19px;padding:11px 17px;background:#137cae;color:white;font-size:14px;
 border-radius:10px;transition:background .16s,transform .16s,box-shadow .16s;
}
.am-entry .am-submit:hover:not(:disabled){background:#0a6795;transform:translateY(-1px);box-shadow:0 6px 14px rgba(19,124,174,.14)}
.am-entry .am-card--secondary .am-submit{background:#174765;color:#fff}
.am-entry .am-card--secondary .am-submit:hover:not(:disabled){background:#0d334e}
.am-entry .am-submit span{font-size:20px;font-weight:500;line-height:1}
.am-entry .am-footnote{font-size:11px;line-height:1.5;color:#6e8390;margin:12px 0 0}
.am-entry .am-teacher-hint{
 display:flex;flex-direction:column;gap:8px;margin-top:18px;
 padding:16px 18px;background:#f2f7fa;border:1px solid #e2ecf2;border-radius:11px;
 font-size:12px;color:#4c6a7c
}
.am-entry .am-teacher-hint strong{color:#28485a;font-size:12px;margin-bottom:1px}
.am-entry .am-teacher-hint span::before{content:"✓";color:#168174;font-weight:800;margin-right:9px}
.am-entry .am-tools{
 display:flex;align-items:center;justify-content:space-between;gap:16px;
 margin-top:18px;padding:17px 20px;background:#fff;
 border:1px solid #dce8ee;border-radius:14px
}
.am-entry .am-tools strong{font-size:14px}
.am-entry .am-tools p{font-size:12px;color:#5a7383;margin:4px 0 0;line-height:1.5}
.am-entry .am-tools button{flex-shrink:0}
.am-entry .am-back{margin-top:14px}
.am-entry .am-back .btn{font-size:12px;padding:10px 14px}
.am-entry .net-error{margin-top:12px;min-height:0}
.am-entry button:focus-visible{outline:3px solid #69b3dc;outline-offset:3px}
@media(max-width:780px){
 .am-entry .am-card-grid{grid-template-columns:1fr}
 .am-entry .am-welcome{min-height:210px;padding:28px}
 .am-entry .am-card{padding:23px}
 .am-entry .am-card--secondary .am-teacher-hint{margin-top:20px}
}
@media(max-width:520px){
 main:has(.am-entry){padding-top:11px}
 .am-entry .am-welcome{min-height:0;padding:25px 22px;border-radius:14px;margin-bottom:13px}
 .am-entry .am-welcome h2{font-size:28px}
 .am-entry .am-welcome h2 br{display:none}
 .am-entry .am-welcome p{font-size:13px}
 .am-entry .am-facts{gap:6px;margin-top:17px}
 .am-entry .am-facts span{font-size:11px;padding:6px 9px}
 .am-entry .am-card-grid{gap:13px}
 .am-entry .am-card{border-radius:13px;padding:19px}
 .am-entry .am-card h3{font-size:19px}
 .am-entry .am-tools{flex-direction:column;align-items:stretch;padding:16px}
 .am-entry .am-tools button{width:100%}
}
@media(prefers-reduced-motion:reduce){.am-entry .am-submit,.am-entry .am-card .net-input{transition:none}.am-entry .am-submit:hover:not(:disabled){transform:none}}


/* Kapazität verständlich als Live-Kennzahlen statt im kleingedruckten Fliesstext. */
.capacity-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.capacity-tile{min-width:0;background:#f0f6fa;border:1px solid #e1eaf0;border-radius:11px;padding:13px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:7px}
.capacity-tile--main{background:#e8f4fa;border-color:#c8e5f2}
.capacity-tile--ok{background:#edf8f4;border-color:#c9e8df}
.capacity-tile--alert{background:#fff3e8;border-color:#f2d8bb}
.capacity-label{color:#31526a;font-size:11px;line-height:1.35;font-weight:750}
.capacity-number{font-size:clamp(21px,2.4vw,28px);letter-spacing:-.035em;color:#102e46;line-height:1.05;font-variant-numeric:tabular-nums}
.capacity-tile--alert .capacity-number{color:#9f4d25}
.capacity-tile--ok .capacity-number{color:#16745d}
.capacity-detail{font-size:11px;line-height:1.4;color:#577184}
.capacity-explain{font-size:12px;line-height:1.55;padding:13px 15px;margin-top:12px;background:#f6f9fc;border-left:3px solid #5098b9;border-radius:6px;color:#38586c}
.capacity-explain strong{color:#183f57}
@media(max-width:390px){.capacity-tiles{grid-template-columns:1fr}.capacity-number{font-size:26px}}


/* Demo-Vorschau: Bedienleiste ausserhalb der echten Mehrspieler-Ansicht. */
.demo-preview-links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.demo-preview-links .hint{width:100%;margin:2px 0 4px}
.demo-preview-links .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:12px;padding:10px 12px}
.demo-preview-toolbar{position:sticky;top:0;z-index:640;background:#123b56;color:#fff;border-radius:13px;padding:13px 16px;margin-bottom:17px;display:flex;align-items:end;gap:13px;flex-wrap:wrap;box-shadow:0 8px 22px rgba(9,36,58,.15)}
.demo-preview-label{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:185px}
.demo-preview-label strong{font-size:12px;letter-spacing:.06em}
.demo-preview-label small{font-size:11px;color:#cce3f0}
.demo-preview-toolbar label{font-size:11px;color:#deeffa;font-weight:650;margin:0;display:flex;flex-direction:column;gap:5px}
.demo-preview-toolbar select{width:auto;min-width:118px;border-radius:7px;padding:7px 9px;border:1px solid #a6c0d2;background:#fff;color:#193d53;font-size:13px}
.demo-preview-toolbar .demo-preview-exit{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:10px 12px;font-size:12px;white-space:nowrap}
@media(max-width:750px){.demo-preview-toolbar{position:relative;top:auto;align-items:stretch}.demo-preview-toolbar label{flex:1;min-width:130px}.demo-preview-toolbar select{width:100%}.demo-preview-label{width:100%}}

/* Einheitliches Finale in lokaler Demo, Online-Spiel und Beamer. */
.final-dashboard{width:100%;max-width:1210px;margin:0 auto;color:#1a354a}
.final-hero{border-radius:20px;padding:30px 32px;background:linear-gradient(120deg,#10344f,#11617c);color:#fff;box-shadow:0 10px 22px rgba(8,43,67,.1)}
.final-hero-overline{font-size:11px;letter-spacing:.14em;font-weight:800;color:#bfe7f6}
.final-hero h2{margin:9px 0 8px;font-size:clamp(27px,3.5vw,40px);line-height:1.12;color:#fff}
.final-hero p{color:#e1f2f7;font-size:14px;margin:0}
.final-weights{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.final-weights span{font-size:12px;font-weight:700;color:#ecf9ff;padding:7px 11px;border:1px solid #5994ac;border-radius:999px}
.final-section-title{font-size:20px;margin:26px 0 13px;color:#1a384d}
.final-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;align-items:end}
.final-podium-card{min-width:0;text-align:center;border-radius:17px;border:1px solid #d6e5ed;background:#fff;padding:23px 15px 20px;box-shadow:0 6px 20px rgba(18,57,80,.05)}
.final-podium-card--first{background:linear-gradient(170deg,#fff8e7,#fff);border-color:#e7ca78;padding-top:34px;padding-bottom:27px;box-shadow:0 8px 26px rgba(141,102,21,.12)}
.final-medal{font-size:33px;margin-bottom:8px}
.final-podium-rank{font-size:12px;font-weight:800;color:#698096}
.final-podium-card h3{font-size:clamp(16px,2vw,22px);margin:7px 0 11px;overflow-wrap:anywhere}
.final-podium-number{font-size:clamp(34px,5vw,51px);line-height:1.06;font-weight:900;color:#0e6789;font-variant-numeric:tabular-nums}
.final-podium-number span{font-size:16px;color:#738a99}
.final-podium-bottom{font-size:11px;color:#48677a;margin-top:10px}
.final-team-list{display:grid;gap:17px}
.final-team{background:#fff;border:1px solid #d8e7ef;border-radius:17px;padding:23px 24px;box-shadow:0 5px 16px rgba(19,62,86,.035)}
.final-team--winner{border-color:#e6ce87;background:linear-gradient(170deg,#fffbf2 0%,#fff 40%)}
.final-team-header{display:flex;justify-content:space-between;gap:15px;align-items:center}
.final-team-rank{font-size:12px;font-weight:800;color:#7a6a43}
.final-team h3{margin:5px 0;font-size:23px;line-height:1.25}
.final-eligibility{display:inline-block;color:#1b795d;font-weight:700;font-size:11px}
.final-eligibility--bad{color:#a9423e}
.final-team-score{font-size:clamp(30px,4.6vw,46px);font-weight:900;white-space:nowrap;color:#0b7190}
.final-team-score span{font-size:12px;color:#647e8d;font-weight:700;display:block;text-align:right}
.final-team-awards{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0 0}
.final-team-awards span{background:#eaf5fa;color:#1e647e;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:750}
.final-team-content{display:grid;grid-template-columns:1fr 1.2fr;gap:23px;margin-top:19px}
.final-team-scores{display:grid;align-content:start;gap:12px}
.final-score-label{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:12px;color:#365568}
.final-score-label strong{color:#123d53}
.final-score-track{margin-top:5px;background:#e9f0f3;height:9px;border-radius:20px;overflow:hidden}
.final-score-track i{display:block;height:100%;background:#1688a4;border-radius:20px}
.final-strengths{display:grid;gap:6px;font-size:11px;color:#506d7f;padding-top:11px;border-top:1px solid #e3edf2}
.final-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.final-info{background:#f0f6f9;border:1px solid #e5eef3;border-radius:10px;padding:11px;min-width:0}
.final-info span{font-size:11px;line-height:1.35;color:#507083;display:block}
.final-info strong{font-size:clamp(13px,1.8vw,17px);display:block;margin-top:6px;color:#153d56;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.final-season-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.final-groups{margin-top:16px;border-top:1px solid #e4edf2;padding-top:14px}
.final-groups summary{cursor:pointer;color:#16688d;font-size:13px;font-weight:750}
.final-group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 19px;padding-top:16px}
.final-restricted{font-size:12px;color:#718596;background:#f5f8fa;border-radius:9px;padding:13px}
.final-awards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.final-award{display:flex;flex-direction:column;gap:7px;border-radius:13px;padding:17px 14px;border:1px solid #dce8ee;background:#fff}
.final-award-label{font-size:11px;color:#648091;font-weight:700}
.final-award strong{font-size:15px;overflow-wrap:anywhere}
.final-award-value{font-size:20px;font-weight:900;color:#0a7695;overflow-wrap:anywhere}
.final-award small{font-size:11px;color:#677f8c;line-height:1.4}
.final-rule{font-size:12px;color:#557081;line-height:1.55;margin:20px 0}
.final-actions{display:flex;gap:10px;flex-wrap:wrap;max-width:1210px;margin:19px auto 10px}
.final-actions .btn{min-width:190px}
@media(max-width:880px){.final-awards{grid-template-columns:repeat(2,minmax(0,1fr))}.final-team-content{grid-template-columns:1fr}}
@media(max-width:600px){.final-hero{padding:22px 19px}.final-podium{gap:7px}.final-podium-card{padding:14px 7px}.final-podium-card--first{padding:20px 7px}.final-medal{font-size:26px}.final-podium-card h3{font-size:13px}.final-podium-number{font-size:29px}.final-podium-number span{font-size:11px}.final-podium-bottom{font-size:9px}.final-team{padding:18px 15px}.final-team h3{font-size:19px}.final-team-score{font-size:30px}.final-facts,.final-group-grid,.final-season-pair{grid-template-columns:1fr}.final-awards{grid-template-columns:1fr 1fr}.final-award-value{font-size:17px}.final-actions .btn{width:100%}}

<header><div><h1>AlpenManager</h1><small>Planspiel · Anspruchsgruppen im St. Galler Managementmodell</small></div><span id="headState" class="pill">Demo-Version</span></header>
<main><div id="app"></div></main>
<script>
"use strict";
const GROUPS=["Kunden","Mitarbeitende","Kapitalgeber","Lieferanten","Staat","Öffentlichkeit / Institutionen","Konkurrenz"];
const EVENTS=[
{title:"Die Energiepreise steigen",desc:"Strom und Treibstoff werden teurer. Die Betriebskosten steigen. Wie reagieren Sie?",factor:1.10,demand:1,green:false,staff:false,snow:false},

const SEGMENT_MARKET=[{name:"Familien",share:.34,elasticity:1.05},{name:"Junge Erwachsene",share:.28,elasticity:1.0},{name:"Sportliche Gäste",share:.25,elasticity:.65},{name:"Premiumgäste",share:.13,elasticity:.4}];
function capacityOf(s,d){return Math.max(42000,90000+(d.staff-60)*1250+(s.assets.lift||0)*8000)}
function appeal(t,segment,e){
 const d=t.pick,s=t.state;
 // Unter CHF 65 nimmt der zusätzliche Werbeeffekt einer Preissenkung deutlich ab.
 const price=Math.pow(65/d.price,segment.elasticity*(d.price<65?.50:1))*Math.exp(-.028*Math.max(0,d.price-75)-.040*Math.max(0,d.price-90));
 const quality=clamp(.75+(s.quality-75)*.012+.028*s.assets.lift+.018*s.assets.service,.55,1.65)*(s.assets.lift&&s.assets.service?.965:1);
 const staffRatio=d.staff/Math.max(50,s.guests/1450);
 const service=clamp(.68+.31*staffRatio,.64,1.2);
 const customer=clamp(.65+s.stake[0]/200,.72,1.15);
 const morale=clamp(.70+s.stake[1]/240,.73,1.12);
 const reputation=clamp(.78+s.stake[5]/330,.78,1.1);
 const supply=clamp(.86+s.stake[3]/460,.85,1.09)*(d.supplier==="günstig"?.995:d.supplier==="nachhaltig"?1.010:1);
 const publicSupport=clamp(.91+s.stake[4]/950,.91,1.03);
 const green=segment.name==="Premiumgäste"||segment.name==="Junge Erwachsene"?(1+.05*s.assets.eco+(e.green?.035*s.assets.eco:0)):1;
 const sport=segment.name==="Sportliche Gäste"?(1+.04*s.assets.lift+.11*s.assets.snow):1;
 const family=segment.name==="Familien"?(1+.03*s.assets.service+.05*s.assets.snow):1;
 const target=segment.name===d.segment?1+.35*(1-Math.exp(-d.marketing/105000)):1+.055*(1-Math.exp(-d.marketing/130000));
 const brand=clamp(.88+s.stake[6]/600,.88,1.06);
 // Teure Familientickets schwächen die zusätzliche Anziehungskraft des Kinderlands.
 const familyPark=segment.name==="Familien"?1+(.16-.04*clamp((d.price-65)/10,0,1))*(s.assets.family||0):1;
 const staffHousing=1+.065*(s.assets.staffHome||0);
 const transport=(segment.name==="Familien"||segment.name==="Junge Erwachsene"?1.10:1.04)**(s.assets.shuttle||0);
 const booking=(segment.name==="Junge Erwachsene"?1.13:segment.name==="Premiumgäste"?1.09:1.035)**(s.assets.digital||0);
 return Math.max(.04,price*quality*service*customer*morale*reputation*supply*publicSupport*green*sport*family*target*brand*familyPark*staffHousing*transport*booking);
}
function marketDemand(teams,e){
 const result=teams.map(()=>0);
 const induced=teams.map(()=>0);
 let extraMarket=0;
 const capacity=teams.map(t=>t.state.bankrupt?0:capacityOf(t.state,t.pick));
 // Die vier Zielgruppen verteilen sich zunächst nach Attraktivität auf die Skigebiete.
 for(const segment of SEGMENT_MARKET){
  const scores=teams.map(t=>t.state.bankrupt?0:appeal(t,segment,e));
  const sum=scores.reduce((a,b)=>a+b,0);
  if(sum===0)continue;
  // Bei Tiefpreisaktionen wechseln Stammgäste weniger stark nur wegen des Preises:
  // Bis zu 36 % der bisherigen Nachfrage bleiben stärker an Qualität,
  // Infrastruktur und Service gebunden. Für Preise ab CHF 65 ist alles wie bisher.
  const activePrices=teams.filter(t=>!t.state.bankrupt).map(t=>t.pick.price);
  const lowPrice=Math.min(...activePrices);
  const loyalShare=.36*clamp((65-lowPrice)/20,0,1);
  const withoutPrice=scores.map((v,i)=>{
   const d=teams[i].pick;
   const priceTerm=Math.pow(65/d.price,segment.elasticity*(d.price<65?.50:1))*Math.exp(-.028*Math.max(0,d.price-75)-.040*Math.max(0,d.price-90));
   return v/priceTerm;
  });
  const stableTotal=withoutPrice.reduce((a,b)=>a+b,0);
  teams.forEach((t,i)=>{
   const marketShare=(1-loyalShare)*scores[i]/sum+loyalShare*withoutPrice[i]/stableTotal;
   result[i]+=240000*e.demand*segment.share*marketShare;
  });
  // Neue Skifahrer statt ausschliesslich Abwerbung: Günstige Preise wecken
  // zusätzliche Nachfrage ausserhalb der bisherigen 240'000 potenziellen Gäste.
  // Die Wirkung sättigt sich, wenn mehrere Gebiete gleichzeitig günstig sind.
  const discounted=teams.map(t=>t.state.bankrupt?0:clamp((65-t.pick.price)/25,0,1));
  const marketActivation=discounted.map(d=>.10*d*segment.elasticity/1.05);
  const newlyInterested=240000*e.demand*segment.share*(1-marketActivation.reduce((p,v)=>p*(1-v),1));
  const weights=teams.map((t,i)=>scores[i]*marketActivation[i]);
  const totalWeight=weights.reduce((a,b)=>a+b,0);
  if(totalWeight>0){
   extraMarket+=newlyInterested;
   teams.forEach((t,i)=>{
    const newGuests=newlyInterested*weights[i]/totalWeight;
    induced[i]+=newGuests;result[i]+=newGuests;
   });
  }
 }
 // Überzählige Nachfrage wird soweit möglich bei Skigebieten mit freien Plätzen verteilt.
 let available=result.map((v,i)=>Math.min(v,capacity[i]));
 // Gäste, die ein besonders günstiges, aber ausgebuchtes Gebiet nicht aufnehmen kann,
 // wechseln häufiger zu anderen Skigebieten statt ganz aus dem Markt zu verschwinden.
 // Für normale Preise bleibt die bisherige Umverteilungsquote von 38 % unverändert.
 const overflow=result.map((v,i)=>Math.max(0,v-capacity[i]));
 let remaining=overflow.reduce((sum,excess,i)=>{
   const price=teams[i].pick.price;
   const rivals=teams.filter((t,j)=>j!==i&&!t.state.bankrupt).map(t=>t.pick.price);
   const rivalAvg=rivals.length?rivals.reduce((a,b)=>a+b,0)/rivals.length:price;
   const discount=price<65?clamp((Math.min(65,rivalAvg)-price)/15,0,1):0;
   return sum+excess*(.38+.50*discount);
 },0);
 const weights=teams.map(t=>t.state.bankrupt?0:SEGMENT_MARKET.reduce((x,seg)=>x+seg.share*appeal(t,seg,e),0));
 for(let step=0;step<8&&remaining>0.1;step++){
   const free=available.map((v,i)=>Math.max(0,capacity[i]-v));
   const totalWeight=free.reduce((sum,v,i)=>sum+(v>0?weights[i]:0),0);
   if(totalWeight===0)break;
   let added=0;
   available=available.map((v,i)=>{const delta=Math.min(free[i],remaining*weights[i]/totalWeight);added+=delta;return v+delta});
   if(added<0.01)break;
   remaining=Math.max(0,remaining-added);
 }
 return {allocated:available,original:result,capacity,unserved:remaining,induced,extraMarket};
}
function runSeason(){clearInterval(ticking);game.teams.forEach(t=>{if(!canBuyInvestment(t.state,t.pick.investment))t.pick.investment="none"});const e=EVENTS[game.season-1];const projected=game.teams.map(t=>{const state=clone(t.state);if(t.pick.investment!=="none"){state.assets[t.pick.investment]++;if(t.pick.investment==="lift")state.quality=clamp(state.quality+7,0,100);}return {...t,state}});const market=marketDemand(projected,e);const outputs=game.teams.map((t,i)=>{const d=t.pick,s=t.state;let ns=clone(s);let news=[];
if(s.bankrupt){
  ns.guests=0;

 const bestOf=(field,filter)=>{const list=eligibleFull.filter(x=>filter?filter(x):x[field]!=null);return list.length?list.slice().sort((a,b)=>b[field]-a[field])[0]:null};
 const profitBest=bestOf("profit"),guestBest=bestOf("guests");
 const goodwill=eligibleFull.length?eligibleFull.slice().sort((a,b)=>b.rating.stakeholder-a.rating.stakeholder)[0]:null;
 const futureBest=eligibleFull.length?eligibleFull.slice().sort((a,b)=>b.rating.future-a.rating.future)[0]:null;
 const note=options.publicView?"Öffentliche Spielwerte – vertrauliche Teamentscheidungen bleiben geschützt.":"Vergleich der drei Skigebiete nach fünf Wintersaisons.";
 const medals=["🥇","🥈","🥉"],podiumOrder=[1,0,2];
 const podium='<div class="final-podium">'+podiumOrder.map(i=>{
   const t=ranked[i];if(!t)return "";
   const label=t.solvent===false?"Nicht gewinnberechtigt":t.solvent===true?"Gewinnberechtigt":"Spielstand";
   return '<div class="final-podium-card '+(i===0&&champ===t?"final-podium-card--first":"")+'"><div class="final-medal">'+(t.solvent===false?'—':medals[Math.max(0,Math.min(2,t.rank-1))])+'</div>'+
    '<div class="final-podium-rank">'+t.rank+'. Platz</div><h3>'+safeName(t.name)+'</h3>'+
    '<div class="final-podium-number">'+(t.total??"–")+'<span>/100</span></div>'+
    '<div class="final-podium-bottom">'+label+'</div></div>';
 }).join("")+'</div>';
 const award=(title,t,amount,sub)=>'<div class="final-award"><span class="final-award-label">'+title+'</span><strong>'+safeName(t?t.name:"Nicht verfügbar")+'</strong>'+
  '<span class="final-award-value">'+(t?amount:"–")+'</span><small>'+sub+'</small></div>';
 const awardPart='<div class="final-awards">'+
  award("Höchster Gesamtgewinn",profitBest,profitBest?fMoney(profitBest.profit):"","Kumulierter Gewinn über fünf Saisons")+
  award("Meiste Gäste insgesamt",guestBest,guestBest?fNum(guestBest.guests):"","Besuche über alle Saisons")+
  award("Stärkste Anspruchsgruppen",goodwill,goodwill?Math.round(goodwill.rating.stakeholder)+"/100":"","Bewertung der sieben Anspruchsgruppen")+
  award("Beste Zukunftsfähigkeit",futureBest,futureBest?Math.round(futureBest.rating.future)+"/100":"","Langfristige Bewertung")+
 '</div>';
 const line=(label,val)=>'<div class="final-info"><span>'+label+'</span><strong>'+val+'</strong></div>';
 const bar=(label,val)=>{
    const num=Number.isFinite(Number(val))?Math.round(Number(val)):null;
    return '<div class="final-score-line"><div class="final-score-label"><span>'+label+'</span><strong>'+(num==null?"–":num+'/100')+'</strong></div>'+
      '<div class="final-score-track"><i style="width:'+percentage(val)+'%"></i></div></div>';
 };
 const details=ranked.map((t,i)=>{
   const s=t.state,r=t.rating;
   const recognised=champ===t&&t.solvent===true;
   const awards=[];
   if(profitBest===t)awards.push("Höchster Gewinn");
   if(guestBest===t)awards.push("Meiste Gäste");
   if(goodwill===t)awards.push("Stärkste Anspruchsgruppen");
   if(futureBest===t)awards.push("Beste Zukunft");
   const strengths=t.strongest&&t.weakest?
       '<div class="final-strengths"><span><strong>Stärke:</strong> '+finalEscape(t.strongest.label)+' ('+fNum(t.strongest.value)+')</span>'+
       '<span><strong>Verbesserungspotenzial:</strong> '+finalEscape(t.weakest.label)+' ('+fNum(t.weakest.value)+')</span></div>':"";
   const data=[
     ["Kumulierter Gewinn",t.profit==null?"–":fMoney(t.profit)],
     ["Schluss-Kontostand",t.cash==null?"–":fMoney(t.cash)],
     ["Gäste über fünf Saisons",t.guests==null?"–":fNum(t.guests)],
     ["Ø Skipasspreis, gästegewichtet",t.avgPrice==null?"–":fMoney(t.avgPrice)],
     ["Mitarbeitende am Schluss",t.staff==null?"–":fNum(t.staff)],
     ["Gekaufte Investitionen",t.investments==null?"–":fNum(t.investments)]
   ];
   const seasons=t.best?'<div class="final-season-pair">'+
      line("Beste Saison",t.best.season+". Saison · "+fMoney(t.best.profit))+
      line("Schwächste Saison",t.worst.season+". Saison · "+fMoney(t.worst.profit))+'</div>':"";
   const groups=s&&Array.isArray(s.stake)?'<details class="final-groups"><summary>Alle sieben Anspruchsgruppen anzeigen</summary><div class="final-group-grid">'+
     GROUPS.map((g,k)=>bar(finalEscape(g),s.stake[k])).join("")+'</div></details>':
      '<div class="final-restricted">Weitere Kennzahlen sind nur in der Lehrpersonenansicht verfügbar.</div>';
   return '<section class="final-team '+(recognised?'final-team--winner':'')+'"><div class="final-team-header"><div>'+
     '<span class="final-team-rank">'+medals[i]+' '+t.rank+'. Platz'+(recognised?' · Sieger':'')+'</span>'+
     '<h3>'+safeName(t.name)+'</h3>'+
     '<span class="final-eligibility '+(t.solvent===false?'final-eligibility--bad':'')+'">'+(t.solvent===false?'Nicht gewinnberechtigt':'Gewinnberechtigt')+'</span>'+
     '</div><div class="final-team-score">'+(t.total??"–")+'<span>/100 Punkte</span></div></div>'+
     (awards.length?'<div class="final-team-awards">'+awards.map(x=>'<span>'+x+'</span>').join("")+'</div>':"")+
     '<div class="final-team-content"><div class="final-team-scores">'+
        (r?bar("Wirtschaft",r.economy)+bar("Anspruchsgruppen",r.stakeholder)+bar("Zukunftsfähigkeit",r.future):
          '<p class="final-restricted">Die drei Teilbewertungen sind nur für die Spielleitung sichtbar.</p>')+
         strengths+
     '</div><div class="final-facts">'+data.map(d=>line(d[0],d[1])).join("")+'</div></div>'+
     seasons+groups+'</section>';
 }).join("");
 return '<div class="final-dashboard"><section class="final-hero"><div class="final-hero-overline">ALPENMANAGER · SAISONFINALE</div>'+
   '<h2>'+(champ?'🏁 Fünf Saisons. Ein Sieger.':'🏁 Fünf Saisons. Kein gewinnberechtigtes Team.')+'</h2><p>'+note+'</p>'+
   '<div class="final-weights"><span>40 % Wirtschaft</span><span>40 % Anspruchsgruppen</span><span>20 % Zukunft</span></div></section>'+
   '<h3 class="final-section-title">Das Siegerpodest</h3>'+podium+
   '<h3 class="final-section-title">Die drei Skigebiete im Detail</h3><div class="final-team-list">'+details+'</div>'+
   '<h3 class="final-section-title">Bestwerte des Wettbewerbs</h3>'+awardPart+
   '<p class="final-rule">Nur zahlungsfähige Skigebiete sind gewinnberechtigt. Bei gleicher Gesamtpunktzahl entscheidet der kumulierte Gewinn, sofern er für beide Teams vorliegt. Ohne diese Angaben wird ein Punktgleichstand ausgewiesen.</p></div>';
}

function showFinal(){
 mode="final";renderHeader();
 const entries=game.teams.map((t,i)=>({name:t.name,slot:i+1,state:t.state}));
 $("#app").innerHTML=finalDashboardHtml(entries)+
  '<div class="final-actions"><button class="btn" id="reset">Neues Spiel</button><button class="btn alt" id="finalHome">Zur Startseite</button></div>';
 $("#reset").onclick=()=>{sessionStorage.removeItem("alpenmanager_demo");game=null;ends=0;startView()};
 $("#finalHome").onclick=()=>{sessionStorage.removeItem("alpenmanager_demo");game=null;ends=0;location.href=location.pathname};
}
document.addEventListener("DOMContentLoaded",()=>{try{startView()}catch(err){console.error("AlpenManager start failed",err);const app=document.getElementById("app");if(app)app.innerHTML="<section class=\"panel\"><h2>Startfehler</h2><p>Bitte Seite neu laden. Technische Meldung: "+String(err.message)+"</p></section>";}});
</script><script src="multiplayer.js?v=20261024finale"></script></body></html>
