<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlpenManager – Anspruchsgruppen</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162e44;background:#edf4f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#0d2942;color:#fff;padding:17px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{font-size:22px;margin:0}header small{color:#b8d0e0}main{max-width:1180px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(90deg,rgba(7,37,62,.92),rgba(7,37,62,.3)),url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1600&q=85') center/cover;min-height:205px;border-radius:18px;color:white;padding:36px;display:flex;flex-direction:column;justify-content:center;margin-bottom:20px}.hero h2{font-size:36px;margin:0 0 9px}.hero p{max-width:650px;margin:0;line-height:1.55}.panel{background:white;border:1px solid #d6e3eb;border-radius:15px;padding:20px;box-shadow:0 3px 15px #173c5d08}.stack{display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;align-items:start}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.metric{background:#f0f6fa;padding:13px;border-radius:10px}.metric small{display:block;color:#375266;margin-bottom:6px}.metric strong{font-size:20px}.btn{border:0;border-radius:10px;background:#1375ac;color:#fff;padding:11px 17px;font-weight:700}.btn.alt{background:#e5f0f7;color:#124769}.btn:disabled{opacity:.5;cursor:not-allowed}h2,h3{margin:0 0 12px}p{line-height:1.55}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input[type=range]{width:100%;accent-color:#1375ac}input[type=text],select{width:100%;padding:10px;border:1px solid #bfcfda;border-radius:9px;background:white}.line{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hint{color:#334a5d;font-size:13px}.bar{background:#e6edf1;border-radius:20px;height:10px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#2996ae;border-radius:20px}.group{display:grid;grid-template-columns:minmax(115px,1fr) 1.2fr 34px;gap:10px;align-items:center;margin:10px 0;font-size:13px}.event{border-left:5px solid #d28d3d;background:#fff5e8;padding:16px;border-radius:10px}.event strong{display:block;margin-bottom:5px}.option{border:1px solid #cbdde9;padding:12px;border-radius:11px;display:block;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:#167fac;background:#ecf8ff}.option:has(input:disabled){opacity:.56;cursor:not-allowed;background:#f1f4f6}.option input{margin-right:9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e2ebf1;padding:9px}th{color:#334d61}.score{font-size:44px;font-weight:800;color:#107b91}.pill{background:#d9eef7;color:#135578;padding:7px 10px;border-radius:40px;font-size:12px;font-weight:800}.timer{font-size:28px;font-variant-numeric:tabular-nums;font-weight:800}.bad{color:#bd4b3c}.good{color:#16866d}.muted{color:#40586b}.hide{display:none}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.top{margin-bottom:16px}@media(max-width:640px){.hero{padding:22px;min-height:160px}.hero h2{font-size:27px}.group{grid-template-columns:115px 1fr 28px}main{padding:12px 10px 40px}}

.event-screen{position:fixed;inset:0;z-index:500;background:#07192b;color:#fff;display:flex;align-items:flex-end;overflow:auto}
.event-photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.72)}
.event-shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(3,19,33,.97),rgba(3,19,33,.37) 60%,rgba(3,19,33,.12))}
.event-content{position:relative;z-index:1;width:min(1050px,100%);margin:0 auto;padding:clamp(28px,6vw,80px) 26px}
.event-content .kicker{font-size:15px;letter-spacing:.13em;text-transform:uppercase;color:#c8eafa;font-weight:800}
.event-content h2{font-size:clamp(35px,5vw,72px);line-height:1.06;margin:14px 0 22px;text-shadow:0 3px 18px #0009}
.event-content p{font-size:clamp(17px,2vw,24px);line-height:1.5;max-width:800px;margin-bottom:26px}
.event-content .btn{font-size:17px;padding:15px 25px}

/* AlpenManager: einheitliche Startseite und Lehrpersonenbereich. */
/* Nur .am-entry betroffen: Spielsimulation, Berichte und Beamer bleiben unverändert. */
body:has(.am-entry){background:#f2f7fa}
main:has(.am-entry){max-width:1110px;padding-top:20px}
.am-entry{width:100%;max-width:1060px;margin:0 auto;color:#19354a}
.am-entry .am-welcome{
  position:relative;isolation:isolate;overflow:hidden;
  min-height:225px;margin:0 0 18px;padding:30px 36px;
  display:flex;align-items:center;
  background:linear-gradient(100deg,rgba(6,31,52,.96) 0%,rgba(8,45,68,.89) 48%,rgba(8,40,60,.27) 100%),
    url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1600&q=85') center 52%/cover;
  color:#fff;border-radius:19px;box-shadow:0 12px 30px rgba(22,58,85,.11)
}
.am-entry .am-welcome-inner{position:relative;z-index:1;max-width:770px}
.am-entry .am-eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:#b9e0f1;margin-bottom:12px}
.am-entry .am-welcome h2{font-size:clamp(27px,3.6vw,39px);line-height:1.13;letter-spacing:-.028em;font-weight:800;margin:0 0 11px;color:#fff}
.am-entry .am-welcome p{font-size:14px;max-width:640px;line-height:1.55;color:#e0edf4;margin:0}
.am-entry .am-facts{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:21px}
.am-entry .am-facts span{display:inline-flex;align-items:center;gap:6px;border-radius:50px;border:1px solid rgba(235,247,255,.26);padding:7px 11px;background:rgba(255,255,255,.10);font-size:12px;color:#e9f6fc}
.am-entry .am-facts strong{font-size:14px;color:white}
.am-entry .am-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:18px}
.am-entry .am-card{
 display:flex;flex-direction:column;min-width:0;
 padding:25px 26px 20px;background:#fff;
 border:1px solid #dce8ee;border-radius:17px;
 box-shadow:0 6px 25px rgba(33,70,97,.055)
}
.am-entry .am-card--primary{border-top:3px solid #137aab}
.am-entry .am-card--secondary{border-top:3px solid #365e79}
.am-entry .am-card-head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.am-entry .am-card-symbol{
 display:flex;flex-shrink:0;align-items:center;justify-content:center;
 width:44px;height:44px;border-radius:13px;background:#e6f3f9;
 color:#16749c;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums
}
.am-entry .am-card--secondary .am-card-symbol{background:#edf1f6;color:#365e79}
.am-entry .am-card-overline{font-size:10px;line-height:1.4;letter-spacing:.12em;font-weight:800;color:#5f7c8d;margin:0 0 4px}
.am-entry .am-card h3{font-size:21px;line-height:1.2;letter-spacing:-.015em;margin:0}
.am-entry .am-card-intro{color:#506a7a;font-size:13px;line-height:1.55;margin:0 0 8px;max-width:450px}
.am-entry .am-form-group{margin-top:13px}
.am-entry .am-form-group label{display:block;font-size:12px;font-weight:750;color:#25465c;margin:0 0 7px}
.am-entry .am-card .net-input{
 display:block;width:100%;min-width:0;min-height:44px;margin:0;
 border:1px solid #c9dce6;border-radius:9px;background:#fff;
 padding:10px 13px;font-size:14px;color:#163d56;transition:border-color .16s,box-shadow .16s;
}
.am-entry .am-card .net-input:hover{border-color:#9fbfce}
.am-entry .am-card .net-input:focus{border-color:#147bac;outline:none;box-shadow:0 0 0 3px rgba(20,123,172,.13)}
.am-entry .am-input-code{text-transform:uppercase;letter-spacing:.065em;font-variant-numeric:tabular-nums}
.am-entry .am-submit{
 width:100%;min-height:47px;display:flex;align-items:center;justify-content:space-between;
 margin-top:19px;padding:11px 17px;background:#137cae;color:white;font-size:14px;
 border-radius:10px;transition:background .16s,transform .16s,box-shadow .16s;
}
.am-entry .am-submit:hover:not(:disabled){background:#0a6795;transform:translateY(-1px);box-shadow:0 6px 14px rgba(19,124,174,.14)}
.am-entry .am-card--secondary .am-submit{background:#174765;color:#fff}
.am-entry .am-card--secondary .am-submit:hover:not(:disabled){background:#0d334e}
.am-entry .am-submit span{font-size:20px;font-weight:500;line-height:1}
.am-entry .am-footnote{font-size:11px;line-height:1.5;color:#6e8390;margin:12px 0 0}
.am-entry .am-teacher-hint{
 display:flex;flex-direction:column;gap:8px;margin-top:18px;
 padding:16px 18px;background:#f2f7fa;border:1px solid #e2ecf2;border-radius:11px;
 font-size:12px;color:#4c6a7c
}
.am-entry .am-teacher-hint strong{color:#28485a;font-size:12px;margin-bottom:1px}
.am-entry .am-teacher-hint span::before{content:"✓";color:#168174;font-weight:800;margin-right:9px}
.am-entry .am-tools{
 display:flex;align-items:center;justify-content:space-between;gap:16px;
 margin-top:18px;padding:17px 20px;background:#fff;
 border:1px solid #dce8ee;border-radius:14px
}
.am-entry .am-tools strong{font-size:14px}
.am-entry .am-tools p{font-size:12px;color:#5a7383;margin:4px 0 0;line-height:1.5}
.am-entry .am-tools button{flex-shrink:0}
.am-entry .am-back{margin-top:14px}
.am-entry .am-back .btn{font-size:12px;padding:10px 14px}
.am-entry .net-error{margin-top:12px;min-height:0}
.am-entry button:focus-visible{outline:3px solid #69b3dc;outline-offset:3px}
@media(max-width:780px){
 .am-entry .am-card-grid{grid-template-columns:1fr}
 .am-entry .am-welcome{min-height:210px;padding:28px}
 .am-entry .am-card{padding:23px}
 .am-entry .am-card--secondary .am-teacher-hint{margin-top:20px}
}
@media(max-width:520px){
 main:has(.am-entry){padding-top:11px}
 .am-entry .am-welcome{min-height:0;padding:25px 22px;border-radius:14px;margin-bottom:13px}
 .am-entry .am-welcome h2{font-size:28px}
 .am-entry .am-welcome h2 br{display:none}
 .am-entry .am-welcome p{font-size:13px}
 .am-entry .am-facts{gap:6px;margin-top:17px}
 .am-entry .am-facts span{font-size:11px;padding:6px 9px}
 .am-entry .am-card-grid{gap:13px}
 .am-entry .am-card{border-radius:13px;padding:19px}
 .am-entry .am-card h3{font-size:19px}
 .am-entry .am-tools{flex-direction:column;align-items:stretch;padding:16px}
 .am-entry .am-tools button{width:100%}
}
@media(prefers-reduced-motion:reduce){.am-entry .am-submit,.am-entry .am-card .net-input{transition:none}.am-entry .am-submit:hover:not(:disabled){transform:none}}

</style></head><body>
<header><div><h1>AlpenManager</h1><small>Planspiel · Anspruchsgruppen im St. Galler Managementmodell</small></div><span id="headState" class="pill">Demo-Version</span></header>
<main><div id="app"></div></main>
<script>
"use strict";
const GROUPS=["Kunden","Mitarbeitende","Kapitalgeber","Lieferanten","Staat","Öffentlichkeit / Institutionen","Konkurrenz"];
const EVENTS=[
{title:"Die Energiepreise steigen",desc:"Strom und Treibstoff werden teurer. Die Betriebskosten steigen. Wie reagieren Sie?",factor:1.10,demand:1,green:false,staff:false,snow:false},
{title:"Winterferien sind gefragt",desc:"Eine gute Wintersaison zeichnet sich ab. Mehr Gäste möchten in die Berge – doch die Kapazität bleibt begrenzt.",factor:1.02,demand:1.03,green:false,staff:false,snow:false},
{title:"Nachhaltiger Tourismus im Fokus",desc:"Gäste, Öffentlichkeit und Behörden erwarten messbare Anstrengungen beim Umweltschutz.",factor:1.04,demand:1,green:true,staff:false,snow:false},
{title:"Fachkräftemangel",desc:"Erfahrene Mitarbeitende sind knapp. Wer beim Personal gespart hat, bekommt die Folgen zu spüren.",factor:1.08,demand:1.02,green:false,staff:true,snow:false},
{title:"Ein schneearmer Winter",desc:"Naturschnee ist knapp. Gute Beschneiung und vorausschauende Investitionen zahlen sich möglicherweise aus.",factor:1.08,demand:.95,green:false,staff:false,snow:true}
];
const INVEST=[
{id:"lift",name:"Moderne Liftanlagen",price:620000,desc:"Mehr Kapazität und Komfort. Langfristig attraktiv für Gäste."},
{id:"snow",name:"Beschneiungsanlage",price:450000,desc:"Weniger wetterabhängig; hoher Energie- und Wasserbedarf."},
{id:"eco",name:"Energie- und Umweltpaket",price:360000,desc:"Anfangs teuer, später tiefere Energiekosten und weniger Umweltbelastung."},
{id:"service",name:"Restaurant und Service",price:280000,desc:"Bessere Gastronomie und höhere Nebenerträge."},
{id:"family",name:"Kinderland und Familienpark",price:300000,desc:"Mehr Familien und zusätzliche Einnahmen, aber laufender Unterhalt."},
{id:"staffHome",name:"Personalunterkünfte",price:340000,desc:"Bessere Arbeitsbedingungen und Personalbindung, aber Unterhaltskosten."},
{id:"shuttle",name:"ÖV-Shuttle zum Skigebiet",price:240000,desc:"Bessere Anreise ohne Auto, stärkt Umweltvertrauen, kostet im Betrieb."},
{id:"digital",name:"Digitales Ticketsystem und Pisten-App",price:210000,desc:"Bequeme Buchung und Informationen, besonders für junge Gäste; IT-Kosten."}
];
const MAX_DEBT=2200000;
const START={cash:1500000,debt:900000,shareCapital:2500000,guests:80000,staff:60,price:65,wage:0,quality:75,marketing:100000,maintenance:160000,stake:[70,70,70,70,70,70,70],assets:{lift:0,snow:0,eco:0,service:0,family:0,staffHome:0,shuttle:0,digital:0},turn:1,totalProfit:0,profits:[],history:[],delayed:[],last:null};
const $=s=>document.querySelector(s);
const money=n=>"CHF "+Math.round(n).toLocaleString("de-CH");
const round=n=>Math.round(n);
const clamp=(x,min,max)=>Math.min(max,Math.max(min,x));
function clone(x){return JSON.parse(JSON.stringify(x))}
function canBuyInvestment(s,id){return id==="none"||(INVEST.some(x=>x.id===id)&&!s.assets[id])}
function defaults(s){return {price:s.price,staff:s.staff,wage:s.wage,marketing:s.marketing,maintenance:s.maintenance,segment:"Familien",supplier:"zuverlässig",investment:"none"}}
const SEGMENTS=["Familien","Junge Erwachsene","Sportliche Gäste","Premiumgäste"];
let game=null, settings=null, mode="start", selected=0, ticking=null, ends=0;
function newGame(names){return {teams:names.map((name,i)=>({id:i,name,state:clone(START),pick:defaults(START)})),season:1,logs:[],started:Date.now()}}
function save(){if(game)sessionStorage.setItem("alpenmanager_demo",JSON.stringify(game))}
function load(){try{return JSON.parse(sessionStorage.getItem("alpenmanager_demo"))}catch{return null}}
function renderHeader(){const s=game?.season||0;$("#headState").textContent=game?"Saison "+Math.min(s,5)+" / 5":"Demo-Version"}
function startView(){mode="start";$("#app").innerHTML='<div class="grid"><section class="panel stack"><h2>Spielanleitung</h2><p>Sie führen ein Skigebiet über <strong>5 Saisons</strong>. Vor jedem Saisonstart erscheint für alle dasselbe Ereignis. Pro Saison haben Sie <strong>4 Minuten</strong> für Ihre Entscheidungen.</p><p>Besprechen Sie vorab kurz Ihre Positionierung: günstig, hochwertig, familienfreundlich oder nachhaltig? Welche Anspruchsgruppen berücksichtigen Sie besonders?</p><p>Die Entscheidungen wirken sich auf Finanzen und die <strong>7 Anspruchsgruppen</strong> aus. Manche Konsequenzen zeigen sich erst in späteren Saisons.</p><p><strong>Schlussbewertung:</strong> 40 % Wirtschaft · 40 % Anspruchsgruppen · 20 % Zukunftsfähigkeit. Zahlungsunfähige Unternehmen können nicht gewinnen. Die Kreditlimite liegt bei CHF 2,2 Mio.</p><p class="hint">Diese erste Version ist eine lokale Testsimulation. Drei Unternehmen können gemeinsam auf einem Gerät durchgespielt werden. Für drei gleichzeitig verbundene Geräte folgt die Supabase-Anbindung.</p><button class="btn" id="create">Testspiel starten</button></section><section class="panel stack"><h2>Lehrpersonen-Dashboard</h2><p>Sie können alle drei Skigebiete verwalten, Entscheidungen testen und die fünf Saisons zentral simulieren.</p><label>Skigebiet 1</label><input id="name0" type="text" value="Alpenblick"><label>Skigebiet 2</label><input id="name1" type="text" value="Schneeglück"><label>Skigebiet 3</label><input id="name2" type="text" value="Bergzauber"><button class="btn alt" id="resume">Letztes Testspiel fortsetzen</button></section></div>';$("#create").onclick=()=>{game=newGame([0,1,2].map(i=>$("#name"+i).value.trim()||"Skigebiet "+(i+1)));selected=0;settings=null;save();showEventIntro()};$("#resume").onclick=()=>{game=load();if(!game){alert("Noch kein gespeichertes Testspiel vorhanden.");return}selected=0;showEventIntro()};renderHeader()}
function metrics(s){return [["Kontostand",money(s.cash)],["Jahresgewinn",s.last?money(s.last.profit):"–"],["Gäste",round(s.guests).toLocaleString("de-CH")],["Mitarbeitende",s.staff],["Gästekapazität",round(capacityOf(s,{staff:s.staff})).toLocaleString("de-CH")],["Skipass",money(s.price)],["Infrastruktur",round(s.quality)+"/100"],["Schulden",money(s.debt)],["Eigenkapital (vereinfacht)",money((s.shareCapital||2500000)+s.totalProfit)]]}
function metricHtml(s){return '<div class="metrics">'+metrics(s).map(k=>'<div class="metric"><small>'+k[0]+'</small><strong>'+k[1]+'</strong></div>').join("")+'</div>'}
function groupsHtml(s){return GROUPS.map((g,i)=>'<div class="group"><span>'+g+'</span><div class="bar"><i style="width:'+s.stake[i]+'%;background:'+(s.stake[i]<40?"#cf7854":"#298fa5")+'"></i></div><strong>'+round(s.stake[i])+'</strong></div>').join("")}
function getDecision(){const read=id=>$("#"+id);return {price:+read("price").value,staff:+read("staff").value,wage:+read("wage").value,marketing:+read("marketing").value,maintenance:+read("maintenance").value,segment:read("segment").value,supplier:read("supplier").value,investment:document.querySelector('input[name=investment]:checked').value}}
function field(id,label,min,max,step,value,prefix="",suffix=""){return '<label for="'+id+'">'+label+' <strong id="'+id+'Val"></strong></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'" data-prefix="'+prefix+'" data-suffix="'+suffix+'">'}

function updateCapacityNote(){const s=game.teams[selected].state,d=getDecision();const n=document.getElementById("capacityNote");if(!n)return;const projected=clone(s);if(d.investment==="lift")projected.assets.lift++;const cap=capacityOf(projected,d);n.textContent="Geplante Gästekapazität: "+cap.toLocaleString("de-CH")+" Gäste pro Saison"+(d.investment==="lift"?" (inklusive +8’000 Plätze durch die neue Liftanlage).":" (abhängig von Personal und bestehenden Liftanlagen).")+" Zusätzliche Nachfrage kann nicht bedient werden."}
const EVENT_IMAGES=["Energiekosten.jpg","pisten.jpeg","natürfreundlich.jpg","mitarbeiter.jpg","Schneemangel.jpg"];
function showEventIntro(){
 if(!game||game.season>5){showFinal();return}
 clearInterval(ticking);mode="intro";ends=0;renderHeader();
 const e=EVENTS[game.season-1],file=EVENT_IMAGES[game.season-1];
 document.getElementById("app").innerHTML='<div class="event-screen" role="dialog" aria-modal="true" aria-label="Saisonereignis">'+
 '<div class="event-photo" style="background-image:url(&quot;'+encodeURI(file)+'?v='+encodeURIComponent(game.season+'-20261022')+'&quot;)"></div>'+
 '<div class="event-shade"></div><div class="event-content"><div class="kicker">Saison '+game.season+' von 5 · Eilmeldung</div>'+
 '<h2>'+e.title+'</h2><p>'+e.desc+'</p>'+
 '<button class="btn" id="beginSeason">Strategiephase starten · 4 Minuten</button></div></div>';
 document.getElementById("beginSeason").onclick=()=>{ends=Date.now()+240000;showSeason()};
}

function capacityOf(s,d){return Math.max(42000,90000+(d.staff-60)*1250+(s.assets.lift||0)*8000)}
function appeal(t,segment,e){
 const d=t.pick,s=t.state;
 // Unter CHF 65 nimmt der zusätzliche Werbeeffekt einer Preissenkung deutlich ab.
 const price=Math.pow(65/d.price,segment.elasticity*(d.price<65?.50:1))*Math.exp(-.020*Math.max(0,d.price-75)-.040*Math.max(0,d.price-90));
 const quality=clamp(.75+(s.quality-75)*.012+.028*s.assets.lift+.018*s.assets.service,.55,1.65)*(s.assets.lift&&s.assets.service?.965:1);
 const staffRatio=d.staff/Math.max(50,s.guests/1450);
 const service=clamp(.68+.31*staffRatio,.64,1.2);
 const customer=clamp(.65+s.stake[0]/200,.72,1.15);
 const morale=clamp(.70+s.stake[1]/240,.73,1.12);
 const reputation=clamp(.78+s.stake[5]/330,.78,1.1);
 const supply=clamp(.86+s.stake[3]/460,.85,1.09)*(d.supplier==="günstig"?.987:d.supplier==="nachhaltig"?1.018:1);
 const publicSupport=clamp(.91+s.stake[4]/950,.91,1.03);
 const green=segment.name==="Premiumgäste"||segment.name==="Junge Erwachsene"?(1+.05*s.assets.eco+(e.green?.035*s.assets.eco:0)):1;
 const sport=segment.name==="Sportliche Gäste"?(1+.04*s.assets.lift+.11*s.assets.snow):1;
 const family=segment.name==="Familien"?(1+.03*s.assets.service+.05*s.assets.snow):1;
 const target=segment.name===d.segment?1+.35*(1-Math.exp(-d.marketing/105000)):1+.055*(1-Math.exp(-d.marketing/130000));
 const brand=clamp(.88+s.stake[6]/600,.88,1.06);
 // Teure Familientickets schwächen die zusätzliche Anziehungskraft des Kinderlands.
 const familyPark=segment.name==="Familien"?1+(.20-.04*clamp((d.price-65)/10,0,1))*(s.assets.family||0):1;
 const staffHousing=1+.065*(s.assets.staffHome||0);
 const transport=(segment.name==="Familien"||segment.name==="Junge Erwachsene"?1.10:1.04)**(s.assets.shuttle||0);
 const booking=(segment.name==="Junge Erwachsene"?1.13:segment.name==="Premiumgäste"?1.09:1.035)**(s.assets.digital||0);

function marketDemand(teams,e){
 const result=teams.map(()=>0);
 const induced=teams.map(()=>0);
 let extraMarket=0;
 const capacity=teams.map(t=>t.state.bankrupt?0:capacityOf(t.state,t.pick));
 // Die vier Zielgruppen verteilen sich zunächst nach Attraktivität auf die Skigebiete.
 for(const segment of SEGMENT_MARKET){
  const scores=teams.map(t=>t.state.bankrupt?0:appeal(t,segment,e));
  const sum=scores.reduce((a,b)=>a+b,0);
  if(sum===0)continue;
  // Bei Tiefpreisaktionen wechseln Stammgäste weniger stark nur wegen des Preises:
  // Bis zu 36 % der bisherigen Nachfrage bleiben stärker an Qualität,
  // Infrastruktur und Service gebunden. Für Preise ab CHF 65 ist alles wie bisher.
  const activePrices=teams.filter(t=>!t.state.bankrupt).map(t=>t.pick.price);
  const lowPrice=Math.min(...activePrices);
  const loyalShare=.36*clamp((65-lowPrice)/20,0,1);
  const withoutPrice=scores.map((v,i)=>{
   const d=teams[i].pick;
   const priceTerm=Math.pow(65/d.price,segment.elasticity*(d.price<65?.50:1))*Math.exp(-.020*Math.max(0,d.price-75)-.040*Math.max(0,d.price-90));
   return v/priceTerm;
  });
  const stableTotal=withoutPrice.reduce((a,b)=>a+b,0);
  teams.forEach((t,i)=>{
   const marketShare=(1-loyalShare)*scores[i]/sum+loyalShare*withoutPrice[i]/stableTotal;
   result[i]+=240000*e.demand*segment.share*marketShare;
  });
  // Neue Skifahrer statt ausschliesslich Abwerbung: Günstige Preise wecken
  // zusätzliche Nachfrage ausserhalb der bisherigen 240'000 potenziellen Gäste.
  // Die Wirkung sättigt sich, wenn mehrere Gebiete gleichzeitig günstig sind.
  const discounted=teams.map(t=>t.state.bankrupt?0:clamp((65-t.pick.price)/25,0,1));
  const marketActivation=discounted.map(d=>.10*d*segment.elasticity/1.05);
  const newlyInterested=240000*e.demand*segment.share*(1-marketActivation.reduce((p,v)=>p*(1-v),1));
  const weights=teams.map((t,i)=>scores[i]*marketActivation[i]);
  const totalWeight=weights.reduce((a,b)=>a+b,0);
  if(totalWeight>0){
   extraMarket+=newlyInterested;
   teams.forEach((t,i)=>{
    const newGuests=newlyInterested*weights[i]/totalWeight;
    induced[i]+=newGuests;result[i]+=newGuests;
   });
  }
 }
 // Überzählige Nachfrage wird soweit möglich bei Skigebieten mit freien Plätzen verteilt.
 let available=result.map((v,i)=>Math.min(v,capacity[i]));
 // Gäste, die ein besonders günstiges, aber ausgebuchtes Gebiet nicht aufnehmen kann,
 // wechseln häufiger zu anderen Skigebieten statt ganz aus dem Markt zu verschwinden.
 // Für normale Preise bleibt die bisherige Umverteilungsquote von 38 % unverändert.
 const overflow=result.map((v,i)=>Math.max(0,v-capacity[i]));
 let remaining=overflow.reduce((sum,excess,i)=>{
   const price=teams[i].pick.price;
   const rivals=teams.filter((t,j)=>j!==i&&!t.state.bankrupt).map(t=>t.pick.price);
   const rivalAvg=rivals.length?rivals.reduce((a,b)=>a+b,0)/rivals.length:price;
   const discount=price<65?clamp((Math.min(65,rivalAvg)-price)/15,0,1):0;
   return sum+excess*(.38+.50*discount);
 },0);
 const weights=teams.map(t=>t.state.bankrupt?0:SEGMENT_MARKET.reduce((x,seg)=>x+seg.share*appeal(t,seg,e),0));
 for(let step=0;step<8&&remaining>0.1;step++){
   const free=available.map((v,i)=>Math.max(0,capacity[i]-v));
   const totalWeight=free.reduce((sum,v,i)=>sum+(v>0?weights[i]:0),0);
   if(totalWeight===0)break;
   let added=0;
   available=available.map((v,i)=>{const delta=Math.min(free[i],remaining*weights[i]/totalWeight);added+=delta;return v+delta});
   if(added<0.01)break;
   remaining=Math.max(0,remaining-added);
 }

}

if(d.staff<s.staff-5&&game.season<5)ns.delayed.push({when:game.season+1,guestFactor:.94,group:1,points:-5,message:"Starker Personalabbau aus der vorherigen Saison führt jetzt zu Engpässen."});for(let k=0;k<7;k++)ns.stake[k]=clamp(ns.stake[k]+delta[k]*.8-1,0,100);ns.quality=clamp(ns.quality,5,100);ns.history.push({season:game.season,guests:ns.guests,profit:round(profit),cash:round(ns.cash),stake:[...ns.stake],price:d.price});ns.last={capacity:round(capacity),potential:round(guestPotential),rejected,inducedDemand:round(newSkiersDemand),marketNewDemand:round(market.extraMarket),preEventGuests:round(guestsBeforeSeasonEffects),transferredGuests:round(transferredGuests),seasonLossGuests:round(Math.max(0,guestsBeforeSeasonEffects-guests)),maintenanceQuality:Math.round(maintenanceQuality*10)/10,supplierRiskCost:round(supplierRiskCost),decision:clone(d),profit:round(profit),revenue:round(rev),cost:round(rev-profit),tickets:round(tickets),extras:round(extras),salary:round(salary),energy:round(fuel),operating:round(operating),marketing:round(d.marketing),maintenance:round(maintenance),interest:round(interest),investment:round(invest),cashBefore:round(cashBefore),borrowing:round(borrowing),guests:round(guests),delta:delta.map(round),news:[...new Set(news)].slice(0,8),before:s};return ns});game.teams.forEach((t,i)=>{t.state=outputs[i];t.ready=false;t.pick=defaults(t.state)});save();showReport()}
function decisionImpact(l,s){
 const d=l.decision||{price:s.price,staff:s.staff,wage:s.wage,marketing:s.marketing,maintenance:s.maintenance,segment:"–",supplier:"–",investment:"none"};
 const fmt=v=>Math.round(v||0).toLocaleString("de-CH");
 const signed=v=>(v>0?"+":"")+Math.round(v*10)/10;
 const item=INVEST.find(x=>x.id===d.investment);
 const qchange=l.before?Math.round((s.quality-l.before.quality)*10)/10:0;
 const row=(factor,result,meaning)=>'<tr><td>'+factor+'</td><td><strong>'+result+'</strong></td><td>'+meaning+'</td></tr>';
 return '<section class="panel" style="margin-top:16px"><h3>So wirkten Ihre Entscheidungen</h3><p class="hint">Die Faktoren wirken zusammen. Einzelne Massnahmen können deshalb nicht als exakte, isolierte Umsatzgewinne ausgewiesen werden.</p><table><thead><tr><th>Faktor</th><th>Ergebnis</th><th>Wirkung</th></tr></thead><tbody>'+
 row("Marktnachfrage",fmt(l.potential)+" Gäste","Abhängig von Preisen, Qualität, Werbung und Konkurrenz.")+
 row("Neue Skifahrer durch günstige Preise",fmt(l.inducedDemand||0)+" Interessenten","Zusätzliche Nachfrage für Ihr Skigebiet, die nicht einfach von anderen Skigebieten abgeworben wird. Die tatsächlichen Gäste bleiben durch die Kapazität begrenzt.")+
 row("Übernommene Gäste",fmt(l.transferredGuests)+" Gäste","Zusätzliche Gäste von ausgebuchten Skigebieten.")+
 row("Kapazitätsgrenze",fmt(l.capacity)+" Gäste","Abhängig von Personal und Liftanlagen.")+
 row("Wetter und frühere Folgen","−"+fmt(l.seasonLossGuests)+" Gäste","Verluste durch Saisonereignis, Mitarbeiterzufriedenheit und frühere Entscheidungen.")+
 row("Tatsächliche Gäste",fmt(l.guests)+" Gäste","Grundlage für Ticketverkäufe und Nebeneinnahmen.")+
 row("Ticketpreis",money(d.price),"Ticketeinnahmen insgesamt: "+money(l.tickets)+".")+
 row("Personal",fmt(d.staff)+" · "+signed(d.wage)+" % Lohn","Personalkosten: "+money(l.salary)+". Personal beeinflusst Kapazität und Service.")+
 row("Marketing",money(d.marketing),"Beworbene Zielgruppe: "+d.segment+". Marketing verbessert die Marktattraktivität.")+
 row("Wartung",money(d.maintenance),"Wartungsbedingte Qualitätsänderung: "+signed(l.maintenanceQuality||0)+" Punkte; gesamte Qualitätsänderung: "+signed(qchange)+" Punkte.")+
 row("Lieferanten",d.supplier,"Zusätzliche Lieferstörungskosten: "+money(l.supplierRiskCost||0)+".")+
 row("Investition",item?item.name:"Keine",item?"Liquiditätsabfluss: "+money(l.investment)+". Die Vorteile und Folgekosten wirken in der Saisonrechnung.":"Keine neue Investition.")+
 '</tbody></table></section>';
}
function reportFinance(l,s){
 const row=(label,val,bold=false)=>'<tr><td>'+(bold?'<strong>':'')+label+(bold?'</strong>':'')+'</td><td style="text-align:right">'+(bold?'<strong>':'')+money(val)+(bold?'</strong>':'')+'</td></tr>';
 return '<section class="panel"><h3>Detaillierter Finanzbericht</h3><table>'+
 row("Skipassverkäufe",l.tickets)+row("Nebeneinnahmen",l.extras)+row("Gesamteinnahmen",l.revenue,true)+
 row("Personalaufwand",l.salary)+row("Energieaufwand",l.energy)+row("Übriger Betriebsaufwand inkl. Lieferanten",l.operating)+row("Marketing",l.marketing)+row("Wartung",l.maintenance)+row("Zinsen",l.interest)+
 row("Gesamtaufwand",l.cost,true)+row(l.profit>=0?"Saisongewinn":"Saisonverlust",l.profit,true)+
 '</table><h3 style="margin-top:18px">Liquidität</h3><table>'+row("Kontostand vor der Saison",l.cashBefore)+row("Saisongewinn / -verlust",l.profit)+row("Investitionen (Geldabfluss)",-l.investment)+row("Neue Kreditaufnahme",l.borrowing)+row("Kontostand nach der Saison",s.cash,true)+'</table><p class="hint">Investitionen sind hier als Geldabfluss, nicht als vollständiger Saisonaufwand berücksichtigt. Vereinfachtes Spielmodell ohne Abschreibungen.</p></section>';
}
function showReport(){mode="report";renderHeader();const t=game.teams[selected],s=t.state,l=s.last;$("#app").innerHTML='<div class="line top"><h2>📊 Saisonbericht '+game.season+'/5</h2><span class="pill">Gleichzeitige Saisonberechnung</span></div><div class="tabs">'+game.teams.map((x,i)=>'<button class="btn '+(i===selected?'':'alt')+'" data-team="'+i+'">'+x.name+'</button>').join("")+'</div><div class="grid"><section class="panel"><h3>Ergebnis '+t.name+'</h3>'+(s.bankrupt?'<p class="bad"><strong>Zahlungsunfähig – aus dem Wettbewerb ausgeschieden.</strong></p>':'')+metricHtml(s)+'<h3 style="margin-top:20px">Veränderung der Anspruchsgruppen</h3>'+GROUPS.map((g,i)=>'<div class="line" style="padding:7px 0;border-bottom:1px solid #eee"><span>'+g+'</span><strong class="'+(l.delta[i]>=0?'good':'bad')+'">'+(l.delta[i]>0?'+':'')+l.delta[i]+' Punkte</strong></div>').join("")+'</section><section class="panel"><h3>Was hat Ihre Entscheidungen bewirkt?</h3><div class="metric"><small>Gästenachfrage vor Kapazitätsbegrenzung</small><strong>'+round(l.potential||l.guests).toLocaleString("de-CH")+'</strong><div class="hint">Kapazität: '+round(l.capacity||0).toLocaleString("de-CH")+' · Nicht bedienbare Nachfrage: '+round(l.rejected||0).toLocaleString("de-CH")+'</div></div>'+l.news.map(x=>'<p style="border-bottom:1px solid #edf1f4;padding-bottom:10px">• '+x+'</p>').join("")+'<p class="hint">Die Kennzahlen entstehen aus Ihren Entscheidungen, dem gemeinsamen Gästemarkt und dem Saisonereignis. Spätere Folgen werden in den entsprechenden Saisonberichten erläutert.</p></section></div>'+decisionImpact(l,s)+'<div style="margin-top:16px">'+reportFinance(l,s)+'</div><div class="panel" style="margin-top:16px"><h3>Vergleich der drei Skigebiete</h3><table><thead><tr><th>Skigebiet</th><th>Gäste</th><th>Gewinn</th><th>Kontostand</th></tr></thead><tbody>'+game.teams.map(x=>'<tr><td>'+x.name+'</td><td>'+round(x.state.guests).toLocaleString("de-CH")+'</td><td>'+money(x.state.last.profit)+'</td><td>'+money(x.state.cash)+'</td></tr>').join("")+'</tbody></table><button style="margin-top:16px" class="btn" id="next">'+(game.season===5?"Schlussauswertung":"Nächste Saison starten")+'</button></div>';document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{selected=+b.dataset.team;showReport()});$("#next").onclick=()=>{game.season++;ends=0;save();showEventIntro()}}
function score(t){
 const s=t.state;
 // Gewinn wird zunehmend schwächer belohnt; hohe Gewinne erreichen nicht bereits nach zwei Saisons 100 Punkte.
 const economy=clamp(52+35*Math.tanh(s.totalProfit/3600000)+11*Math.tanh((s.cash-1500000)/2200000)-18*Math.tanh(Math.max(0,s.debt-900000)/1100000),0,100);
 const avg=s.stake.reduce((a,b)=>a+b,0)/7;
 const stakeholder=clamp(.75*avg+.25*Math.min(...s.stake),0,100);
 const ecology=clamp(55+18*(s.assets.eco||0)+8*(s.assets.shuttle||0)-4*(s.assets.snow||0)+.18*(s.stake[5]-70),0,100);
 const financialReserves=clamp(75-(s.debt-900000)/26000,0,100);
 const future=clamp(.35*s.quality+.25*ecology+.2*s.stake[1]+.2*financialReserves,0,100);
 const solvent=!s.bankrupt&&s.cash>=0&&s.debt<=MAX_DEBT;
 const total=Math.round(economy*.4+stakeholder*.4+future*.2);
 return {economy,stakeholder,future,total,solvent};
}
function showFinal(){mode="final";renderHeader();const ranks=game.teams.map(t=>({t,score:score(t)})).sort((a,b)=>(b.score.solvent?1:0)-(a.score.solvent?1:0)||b.score.total-a.score.total);$("#app").innerHTML='<section class="panel stack"><h2>🏆 Finale – fünf Saisons sind gespielt</h2><p>40 % wirtschaftlicher Erfolg · 40 % Anspruchsgruppen · 20 % Zukunftsfähigkeit. Zahlungsunfähige Skigebiete behalten ihre erreichten Punkte, sind aber nicht gewinnberechtigt. Bei Ausschöpfung der Kreditlimite endet der Spielbetrieb.</p>'+ranks.map((x,i)=>'<div class="panel"><div class="line"><h3>'+(i+1)+'. '+x.t.name+'</h3><span class="score">'+x.score.total+'/100</span></div><p>Wirtschaft '+round(x.score.economy)+'/100 · Anspruchsgruppen '+round(x.score.stakeholder)+'/100 · Zukunft '+round(x.score.future)+'/100</p><p class="hint">'+(x.score.solvent?"Gewinnberechtigt":"Nicht gewinnberechtigt: Zahlungsunfähigkeit")+' · '+money(x.t.state.totalProfit)+' kumulierter Saisongewinn</p></div>').join("")+'<h3>Reflexion</h3><p>Welche Anspruchsgruppen haben Sie besonders berücksichtigt? Welche Interessen standen im Widerspruch? Welche Entscheidungen waren kurzfristig attraktiv, hatten aber langfristig Nachteile? Haben Sie Ihre ursprüngliche Positionierung eingehalten?</p><button class="btn" id="reset">Neues Spiel</button></section>';$("#reset").onclick=()=>{sessionStorage.removeItem("alpenmanager_demo");game=null;ends=0;startView()}}
